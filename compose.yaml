services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL in .env (public API URL)}
    image: studyflow-front:latest
    container_name: studyflow-front
    restart: unless-stopped

    expose:
      - "80"

    networks:
      - gateway

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  gateway:
    external: true
